[package]
name = "mongui"
version = "0.1.0"
edition = "2024"
description = "A small, fast MongoDB browser with JKS keystore support"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
futures-util = "0.3.34"
hex = "0.4.3"
mongodb = { version = "3", features = ["rustls-tls", "cert-key-password"] }
p12-keystore = "0.4.1"
percent-encoding = "2.3.2"
rfd = "0.18.0"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
